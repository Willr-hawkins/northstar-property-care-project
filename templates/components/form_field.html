{# Accessible form field: label, optional hint, error message, then the input. Expects `field`. #}
<div class="flex flex-col gap-2">
  <label for="{{ field.id_for_label }}" class="text-[15px] font-semibold text-charcoal">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-muted">(optional)</span>{% endif %}</label>
  {% if field.help_text %}<p id="id_{{ field.name }}_helptext" class="text-[15px] text-muted">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p id="id_{{ field.name }}_error" class="text-[15px] font-medium text-terracotta-deep">{{ field.errors.0 }}</p>{% endif %}
  {{ field }}
</div>
