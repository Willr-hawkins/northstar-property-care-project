<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Something went wrong — Northstar Property Care</title>
  <style>
    /* Inline on purpose: this page must render even if static files or templates are failing. */
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #F8F7F3; color: #292B29; font: 17px/1.6 "Hanken Grotesk", system-ui, sans-serif; }
    header { border-bottom: 1px solid rgba(41,43,41,.12); padding: 22px 24px; }
    main { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 96px 24px; box-sizing: border-box; }
    .brand { font-family: Fraunces, Georgia, serif; font-size: 22px; color: #25382F; text-decoration: none; }
    .eyebrow { margin: 0 0 24px; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #8A4F31; font-weight: 500; }
    h1 { margin: 0 0 28px; max-width: 800px; font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: clamp(44px, 6vw, 88px); line-height: 1.02; letter-spacing: -.02em; color: #25382F; }
    p { max-width: 460px; color: #3F423E; }
    .button { display: inline-block; margin-top: 24px; padding: 16px 28px; background: #25382F; color: #F8F7F3; text-decoration: none; border-radius: 2px; font-weight: 500; }
    .button:focus-visible, .brand:focus-visible { outline: 2px solid #B87551; outline-offset: 3px; }
  </style>
</head>
<body>
  <header><a href="/" class="brand">Northstar</a></header>
  <main>
    <p class="eyebrow">Error 500</p>
    <h1>Something went wrong on our side.</h1>
    <p>We've been notified and we're looking into it. Please try again in a few minutes. If you were sending an enquiry, it may not have gone through.</p>
    <a href="/" class="button">Back to the homepage</a>
  </main>
</body>
</html>
